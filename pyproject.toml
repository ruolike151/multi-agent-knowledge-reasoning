[project]
name = "akr"
version = "0.1.0"
description = "多智能体企业知识推理系统"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "neo4j>=5.20",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
embed = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." 让 Task 22 起的 eval/ 也可导入
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实外部依赖（DeepSeek API / Neo4j）的测试",
]
